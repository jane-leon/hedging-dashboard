<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pixel { shape-rendering: crispEdges; }
    </style>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="256" height="256" fill="none"/>
  
  <!-- 16x16 pixel grid, scaled up 16x = 256x256 -->
  <g transform="scale(16)">
    <!-- Dead antenna (gray) -->
    <rect x="7" y="0" width="2" height="1" class="pixel" fill="#808080"/>
    <rect x="7" y="1" width="2" height="1" class="pixel" fill="#808080"/>
    <rect x="6" y="2" width="4" height="1" class="pixel" fill="#808080"/>
    
    <!-- Head outline -->
    <rect x="4" y="3" width="8" height="1" class="pixel" fill="#000000"/>
    <rect x="3" y="4" width="1" height="8" class="pixel" fill="#000000"/>
    <rect x="12" y="4" width="1" height="8" class="pixel" fill="#000000"/>
    <rect x="4" y="12" width="8" height="1" class="pixel" fill="#000000"/>
    
    <!-- Face fill (dark red - faded) -->
    <rect x="4" y="4" width="8" height="8" class="pixel" fill="#8B0000"/>
    
    <!-- X eyes (dead) -->
    <rect x="5" y="5" width="1" height="1" class="pixel" fill="#000000"/>
    <rect x="6" y="6" width="1" height="1" class="pixel" fill="#000000"/>
    <rect x="7" y="5" width="1" height="1" class="pixel" fill="#000000"/>
    <rect x="6" y="7" width="1" height="1" class="pixel" fill="#000000"/>
    
    <rect x="9" y="5" width="1" height="1" class="pixel" fill="#000000"/>
    <rect x="10" y="6" width="1" height="1" class="pixel" fill="#000000"/>
    <rect x="11" y="5" width="1" height="1" class="pixel" fill="#000000"/>
    <rect x="10" y="7" width="1" height="1" class="pixel" fill="#000000"/>
    
    <!-- Flat line mouth (dead) -->
    <rect x="5" y="10" width="6" height="1" class="pixel" fill="#000000"/>
    
    <!-- Warning symbols on head -->
    <rect x="3" y="3" width="1" height="1" class="pixel" fill="#f59e0b"/>
    <rect x="12" y="3" width="1" height="1" class="pixel" fill="#f59e0b"/>
    
    <!-- Arms down (defeated/lifeless) -->
    <rect x="2" y="10" width="1" height="3" class="pixel" fill="#808080"/>
    <rect x="13" y="10" width="1" height="3" class="pixel" fill="#808080"/>
    
    <!-- Body (faded dark red) -->
    <rect x="5" y="13" width="6" height="1" class="pixel" fill="#000000"/>
    <rect x="5" y="14" width="6" height="2" class="pixel" fill="#8B0000"/>
    
    <!-- Circuit pattern (all dead/gray) -->
    <rect x="6" y="14" width="1" height="1" class="pixel" fill="#808080"/>
    <rect x="9" y="15" width="1" height="1" class="pixel" fill="#808080"/>
    
    <!-- Feet (gray) -->
    <rect x="5" y="16" width="2" height="1" class="pixel" fill="#808080"/>
    <rect x="9" y="16" width="2" height="1" class="pixel" fill="#808080"/>
  </g>
</svg>